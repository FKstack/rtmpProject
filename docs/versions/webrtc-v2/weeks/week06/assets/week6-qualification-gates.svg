  <style>.t{font:24px 'Microsoft YaHei',sans-serif;fill:#172033}.s{font:18px 'Microsoft YaHei',sans-serif;fill:#334155}.b{fill:#eef6ff;stroke:#2878c8;stroke-width:3}.g{fill:#effbf3;stroke:#26834a;stroke-width:3}.w{fill:#fff6e5;stroke:#c77b00;stroke-width:3}.a{stroke:#475569;stroke-width:4;marker-end:url(#e)}</style><defs><marker id="e" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
