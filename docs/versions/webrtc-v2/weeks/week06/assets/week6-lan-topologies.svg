<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>.t{font:24px 'Microsoft YaHei',sans-serif;fill:#172033}.s{font:18px 'Microsoft YaHei',sans-serif;fill:#334155}.p{fill:#eef6ff;stroke:#2878c8;stroke-width:3}.v{fill:#effbf3;stroke:#26834a;stroke-width:3}.a{stroke:#475569;stroke-width:4;marker-end:url(#e)}.d{stroke:#a16207;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#e)}</style><defs><marker id="e" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="700" fill="#fafcff"/><text x="50" y="55" class="t">Week 6 双机 LAN 的两种正交拓扑</text>
  <text x="55" y="110" class="t">拓扑一：publisher / Offerer ↔ viewer / Answerer</text>
  <rect x="80" y="145" width="360" height="130" rx="16" class="p"/><text x="140" y="195" class="t">PC A：publisher</text><text x="145" y="232" class="s">Offerer · sample.mp4</text>
  <rect x="760" y="145" width="360" height="130" rx="16" class="v"/><text x="830" y="195" class="t">PC B：viewer</text><text x="835" y="232" class="s">Answerer · CPU canvas</text>
  <path d="M440 190 H760" class="d"/><text x="520" y="175" class="s">完整 Offer/Answer JSON 包</text><path d="M440 240 H760" class="a"/><text x="525" y="265" class="s">host/host UDP RTP</text>
  <text x="55" y="365" class="t">拓扑二：viewer / Offerer ↔ publisher / Answerer</text>
  <rect x="80" y="405" width="360" height="130" rx="16" class="v"/><text x="150" y="455" class="t">PC A：viewer</text><text x="155" y="492" class="s">Offerer · CPU canvas</text>
  <rect x="760" y="405" width="360" height="130" rx="16" class="p"/><text x="820" y="455" class="t">PC B：publisher</text><text x="825" y="492" class="s">Answerer · sample.mp4</text>
  <path d="M440 450 H760" class="d"/><text x="520" y="435" class="s">完整 Offer/Answer JSON 包</text><path d="M760 500 H440" class="a"/><text x="525" y="525" class="s">host/host UDP RTP</text>
  <text x="85" y="625" class="s">selectedCandidatePair 只记录 type/transport；绝不记录 IP、端口、candidate 行、SDP、fingerprint。</text>
  <text x="85" y="660" class="s">同机两个包副本只能证明便携布局与搬运流程，不能替代这张图所示的两台物理电脑。</text>
</svg>
