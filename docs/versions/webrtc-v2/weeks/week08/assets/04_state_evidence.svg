<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#eff6ff}.h{font-size:30px;font-weight:700}.s{font-size:18px}.n{font-size:23px;font-weight:700}.i{fill:#15263d;stroke:#6aaeff;stroke-width:2}.g{fill:#10392e;stroke:#4fd2a4;stroke-width:3}.r{fill:#3b2026;stroke:#ff7888;stroke-width:2}.y{fill:#3b3218;stroke:#f4ce5c;stroke-width:2}.a{stroke:#9bc6ff;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#9bc6ff"/></marker></defs>
  <rect width="1280" height="720" fill="#091321"/><text class="t h" x="48" y="55">产品状态不是连接回调的别名，而是证据分类</text>
  <rect class="i" x="55" y="115" width="210" height="90" rx="45"/><text class="t n" x="135" y="170">Idle</text>
  <rect class="i" x="350" y="115" width="240" height="90" rx="45"/><text class="t n" x="402" y="158">Connecting</text><text class="t s" x="392" y="186">等待信令 / 首帧</text>
  <rect class="g" x="680" y="95" width="270" height="130" rx="22"/><text class="t n" x="776" y="137">Direct</text><text class="t s" x="712" y="169">非 relay selected pair</text><text class="t s" x="710" y="198">真实呈现帧年龄 ≤ 1,000 ms</text>
  <path class="a" d="M265 160 H345"/><path class="a" d="M590 160 H675"/>
  <rect class="y" x="210" y="350" width="330" height="150" rx="20"/><text class="t n" x="301" y="393">NeedsRelay</text><text class="t s" x="246" y="430">ConnectionFailed + ICE Failed</text><text class="t s" x="252" y="462">且见过 srflx；不靠猜测</text>
  <rect class="r" x="740" y="350" width="330" height="150" rx="20"/><text class="t n" x="870" y="393">Error</text><text class="t s" x="775" y="430">信令/连接超时、断线、媒体超时</text><text class="t s" x="788" y="462">或当前呈现超过 1,000 ms</text>
  <path class="a" d="M430 205 C430 265 375 280 375 345"/><path class="a" d="M520 205 C630 260 905 270 905 345"/><path class="a" d="M815 225 V345"/><path class="a" d="M885 350 C1060 260 1030 170 955 160"/>
  <text class="t s" x="965" y="277">新鲜画面恢复</text>
  <rect x="175" y="590" width="930" height="72" rx="16" fill="#251c35" stroke="#c894ff" stroke-width="2"/><text class="t n" x="300" y="623">Connected 但没有呈现 ≠ Direct　收到 RTP ≠ Direct　完成解码 ≠ Direct</text><text class="t s" x="425" y="651">产品只承诺当前用户确实看得到的事实</text>
</svg>
