  <circle cx="980" cy="225" r="95" fill="#17304d" stroke="#60a5fa" stroke-width="3"/><text x="980" y="215" text-anchor="middle" fill="#fff" font-size="22">Peer B</text><text x="980" y="248" text-anchor="middle" fill="#bfdbfe" font-size="17">收集 host / srflx</text>
