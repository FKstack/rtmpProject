<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <rect width="1200" height="500" fill="#101827"/><text x="55" y="55" fill="#f8fafc" font-size="28">固定本机 ICE 配置边界</text>
  <rect x="60" y="115" width="300" height="250" rx="16" fill="#3b1d2b" stroke="#fb7185" stroke-width="2"/><text x="210" y="155" text-anchor="middle" fill="#fecdd3" font-size="21">不受信任输入面</text><text x="90" y="205" fill="#fff" font-size="18">拒绝：CLI URL / 任意路径</text><text x="90" y="245" fill="#fff" font-size="18">拒绝：TURN / 凭据 / 额外字段</text><text x="90" y="285" fill="#fff" font-size="18">拒绝：占位符 / 大于 4 KiB</text>
  <rect x="450" y="115" width="300" height="250" rx="16" fill="#15334a" stroke="#38bdf8" stroke-width="2"/><text x="600" y="155" text-anchor="middle" fill="#bae6fd" font-size="21">WebRtcIceRuntimeConfigLoader</text><text x="480" y="205" fill="#fff" font-size="18">只读一次 schema v1</text><text x="480" y="245" fill="#fff" font-size="18">固定 local-config 路径</text><text x="480" y="285" fill="#fff" font-size="18">输出既有 IceRuntimeConfig</text>
  <rect x="840" y="115" width="300" height="250" rx="16" fill="#153c31" stroke="#34d399" stroke-width="2"/><text x="990" y="155" text-anchor="middle" fill="#a7f3d0" font-size="21">transport</text><text x="870" y="205" fill="#fff" font-size="18">仅接收运行时值对象</text><text x="870" y="245" fill="#fff" font-size="18">只暴露候选类型 / ICE state</text><text x="870" y="285" fill="#fff" font-size="18">地址与 candidate 不越层</text>
  <g stroke="#fbbf24" stroke-width="5"><path d="M360 240h90"/><path d="M750 240h90"/></g><text x="55" y="430" fill="#cbd5e1" font-size="18">配置文件、授权记录和真实 URL 只存在于 Git 忽略的本机运行目录，不进入 ZIP、manifest、日志或报告。</text>
</svg>
