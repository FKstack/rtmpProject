# RtmpMonitor 媒体服务器配置示例
#
# 使用方法：复制本文件为 media-server.ini，并在 Visual Studio 的目标启动参数中
# 通过 --media-server-config <path> 指定。开发期不建议直接双击未部署 Qt DLL 的 EXE。
# 本文件只保存只读接入信息；不得写入任何真实凭据、Token 或鉴权 URL。

[server]
# SRS 所在主机：开发期 WSL2  mirrored networking 下为 127.0.0.1；
# 摄像头/客户端从局域网访问时应改为 SRS 主机的 LAN 地址。
host = 127.0.0.1

# RTMP 推拉流端口，对应 srs-minimal.conf 的 listen 1935。
rtmpPort = 1935

# 单层 RTMP application 名，只允许 [A-Za-z0-9_-]+。
application = live

# 本机健康检查 API 根地址；1985 只应绑定回环，不向局域网开放。
apiBaseUrl = http://127.0.0.1:1985

# 是否启用 /api/v1/versions 健康探测；关闭后仅凭 RTMP 端口判断健康。
apiHealthEnabled = true

# 摄像头档案段名以 camera 开头，例如 [camera01]。
# 合法档案会在客户端启动时接入播放器；--no-camera-autostart 可关闭自动连接。
[camera01]
# 稳定配置 ID，只允许 [A-Za-z0-9_-]+；缺省时使用段名。
cameraId = camera01
# 用户可见名称，缺省时使用 cameraId。
displayName = 摄像头 01
# SRS 流名，完整 URL 由客户端生成为 rtmp://<rtmp-host>:<rtmpPort>/<application>/<streamKey>。
streamKey = camera01
# true 表示启动后立即连接；false 表示只加载档案。
autoStart = true
