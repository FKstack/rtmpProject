# RtmpMonitor Phase 1: RTMP push/pull + local health API only.
# Baseline: SRS v6.0-r0 (6.0.184). Field names cross-checked against
# trunk/conf/full.conf of the pinned tag.
listen                  1935;
max_connections         100;

daemon                  off;
srs_log_tank            console;
srs_log_level_v2        info;

http_api {
    enabled             on;
    listen              127.0.0.1:1985;
    crossdomain         off;
    raw_api {
        enabled         off;
        allow_reload    off;
    }
}

vhost __defaultVhost__ {
    enabled             on;
}
