# RtmpMonitor Phase 1: RTMP push/pull + local health API only.
# Baseline: SRS v6.0-r0 (6.0.184). Field names cross-checked against
# trunk/conf/full.conf of the pinned tag.
listen                  1935;
max_connections         100;

daemon                  off;
srs_log_tank            console;
srs_log_level_v2        info;

http_api {
    enabled             on;
    listen              127.0.0.1:1985;
    crossdomain         off;
    raw_api {
        enabled         off;
        allow_reload    off;
    }
}

vhost __defaultVhost__ {
    enabled             on;
    # Keep audio messages interleavable with large H.264 frames without the
    # per-chunk overhead of RTMP's 128-byte compatibility baseline.
    chunk_size          4096;
    # Qualification streams trade batching throughput for deterministic local
    # latency.  Without this block SRS defaults to a 350 ms merged-write batch,
    # which makes a 30 FPS source arrive at the client in visible bursts.
    tcp_nodelay         on;
    min_latency         on;

    play {
        gop_cache       off;
        queue_length    10;
        # Preserve publisher PTS for bounded A/V synchronization and
        # qualification. The default jitter mode restarts each player at zero,
        # which prevents source/client timestamp correlation.
        atc             on;
        # With min_latency enabled, zero keeps this controlled local link on
        # the pass-through path. A measured 100 ms batch increased packet loss
        # and sink underruns, so the qualification baseline remains unbatched.
        mw_latency      0;
    }

    publish {
        mr              off;
    }
}
